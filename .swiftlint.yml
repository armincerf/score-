# SwiftLint configuration — lint only. Formatting is owned by swift-format (.swift-format).
# Run: make lint   (or: swiftlint lint --strict)

included:
  - score
  - scorewatch Watch App
  - scoreTests

excluded:
  - build
  - DerivedData
  - .build

# Formatting rules are disabled here because `swift format` owns formatting.
disabled_rules:
  - trailing_comma
  - trailing_whitespace
  - vertical_whitespace
  - opening_brace
  - colon
  - comma
  - closing_brace
  - closure_parameter_position
  - control_statement
  - leading_whitespace
  - multiple_closures_with_trailing_closure
  - function_name_whitespace
  - return_arrow_whitespace
  - statement_position
  - switch_case_alignment
  - todo
  - void_return
  - trailing_newline
  - non_optional_string_data_conversion
  - sorted_imports  # swift-format OrderedImports owns import order

opt_in_rules:
  - array_init
  - async_without_await
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - direct_return
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - incompatible_concurrency_annotation
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - modifier_order
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_key_path
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_swiftui_state
  - redundant_nil_coalescing
  - redundant_type_annotation
  - shorthand_optional_binding
  - sorted_first_last
  - static_operator
  - superfluous_else
  - toggle_bool
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - yoda_condition

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
  ignores_function_declarations: false

function_body_length:
  warning: 60
  error: 120

type_body_length:
  warning: 350
  error: 600

file_length:
  warning: 600
  error: 1200
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 15
  error: 25

function_parameter_count:
  warning: 6
  error: 9

nesting:
  type_level: 2
  function_level: 3

identifier_name:
  min_length: 2
  max_length: 50
  excluded: [id, x, y, i, j, p1, p2, to, at, in, up, db, ok]

large_tuple:
  warning: 3
  error: 4

force_cast: error
force_try: error
force_unwrapping: error

custom_rules:
  no_print:
    name: "No print()"
    regex: '(^|[^\w.])print\('
    match_kinds:
      - identifier
    message: "Use `Logger` (see score/Log.swift) instead of print so logs are filterable and stripped of private data."
    severity: warning
  no_dispatch_main:
    name: "No DispatchQueue.main"
    regex: 'DispatchQueue\.main'
    message: "Hop to the main actor with `Task { @MainActor in ... }` or `MainActor.run` instead of DispatchQueue.main."
    severity: warning
  no_nslog:
    name: "No NSLog"
    regex: '\bNSLog\('
    message: "Use `Logger` instead of NSLog."
    severity: warning

reporter: "xcode"
