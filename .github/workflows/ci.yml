name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    # Same image as the build so swift-format (bundled with Xcode 27) matches local runs.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - run: make lint

  build-test:
    name: Build & test (Xcode 27)
    # `xcode-27` is GitHub's Apple-silicon image with Xcode 27 + iOS/watchOS 27 runtimes.
    # It is labelled "preview" by GitHub; if it is retired, switch to `macos-26` and
    # `sudo xcode-select -s /Applications/Xcode_27.0.app`.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -E "iOS|watchOS"
      - name: Build iOS + watch app
        run: make build
      - name: Build watch app
        run: make build-watch
      - name: Unit tests
        run: make test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .build/results
          if-no-files-found: ignore
